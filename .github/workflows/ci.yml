name: CI

on:
  push:
    branches:
      - main
      - sitev01
  pull_request:
    branches:
      - main
      - sitev01

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm test

      - name: Build
        run: npm run build
